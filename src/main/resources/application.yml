# ============================================================
# SmartPark :: User Service
# Port  : 8081
# DB    : MySQL → smartpark_users
# ============================================================

server:
  port: 8081

spring:
  application:
    name: user-service

  config:
    import: "optional:configserver:http://localhost:8888"

  # ── MySQL Datasource ──────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/smartpark_users?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update         # Creates/updates schema; switch to 'validate' in prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    # IMPORTANT: defer-datasource-initialization=true ensures data.sql runs
    # AFTER Hibernate has created the schema (required when ddl-auto != none)
    defer-datasource-initialization: true

  # ── SQL Init (data.sql) ───────────────────────────────────
  sql:
    init:
      mode: always             # Always run data.sql (DataInitializer is idempotent)

  # ── Security (permit all — add JWT filter in a future iteration) ──
  security:
    user:
      name: actuator-admin
      password: actuator-secret

# ── Eureka Client ─────────────────────────────────────────
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5

# ── Actuator ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, env, refresh
  endpoint:
    health:
      show-details: always

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    dev.smartpark.userservice: DEBUG
    org.hibernate.SQL: DEBUG
    root: INFO
